# Reproduce issue #224's accelerated-MaxSim benchmark on a single H100.
#
# Times the pylate fp16 baseline vs. the LIK kernel across all five timing
# sections + the precision section. Drops one JSON per run under
# bench_results/issue224/. The "fast" pass (--sections 1 2 5 6) finishes
# in a couple of minutes; the full sweep including training (§3, §4) takes
# longer because of the larger backward shapes.
#
# Launch:
#
#   sky launch -y -c pylate-issue224 scripts/sky_benchmark.yaml
#
# Pull results:
#
#   scp pylate-issue224:~/sky_workdir/bench_results/issue224/*.json \
#       ./bench_results/issue224/
#
# Then `sky down -y pylate-issue224` once the scp is done.

name: pylate-issue224

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.4.1-runtime-ubuntu22.04
  accelerators: H100:1
  cpus: 8+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  uv venv --clear --python 3.11 .venv
  source .venv/bin/activate
  uv pip install -e ".[kernels]"
  python -c "import torch; print('torch:', torch.__version__)"
  python -c "import late_interaction_kernels as lik; print('LIK:', getattr(lik, '__version__', 'installed'))"

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  source .venv/bin/activate

  mkdir -p bench_results/issue224

  python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('cap:', torch.cuda.get_device_capability())"

  echo "================================================================"
  echo "issue #224 — sections 1, 2, 5, 6 (fast pass: forward + precision)"
  echo "================================================================"
  python scripts/benchmark.py \
    --out bench_results/issue224/fast.json \
    --sections 1 2 5 6 \
    --dtype fp16 --iters 10 --warmup 3 --seed 0

  echo "================================================================"
  echo "issue #224 — sections 3, 4 (training: fwd+bwd)"
  echo "================================================================"
  python scripts/benchmark.py \
    --out bench_results/issue224/train.json \
    --sections 3 4 \
    --dtype fp16 --iters 10 --warmup 3 --seed 0

  echo "================================================================"
  echo "Done. Result files:"
  echo "================================================================"
  ls -la bench_results/issue224/
